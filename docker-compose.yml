# Log rotation, applied to every service below via `<<: *logs`.
#
# Docker's default json-file driver keeps growing forever — there was no cap on
# anything here. Today that is not a fire (the noisiest container writes ~3 MB a
# day against 4 TB free), which is exactly why it is worth fixing now rather
# than during an incident: at 100x the traffic this becomes real, and a disk
# that fills takes Postgres down with it.
#
# 50 MB x 3 files caps each container at 150 MB, which still holds days of
# history for anything here.
x-logging: &logs
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

services:
  postgres:
    <<: *logs
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superbot
      POSTGRES_PASSWORD: superbot
      POSTGRES_DB: superbot
    ports:
      # 127.0.0.1 only. Published on 0.0.0.0 this was reachable from the whole
      # LAN with superbot/superbot — proven: a host on the network read the
      # users table straight off. The app containers never used this port; they
      # reach Postgres over the compose network as `postgres:5432`. This binding
      # is only for admin access from the host itself. A remote `db push` from a
      # dev machine now needs an SSH tunnel instead of a raw LAN connection.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbot -d superbot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Self-hosted error tracking (GlitchTip: independent project, speaks the
  # Sentry API, so the official Sentry SDKs talk to it unchanged).
  #
  # Self-hosted on purpose. Crash reports carry Telegram ids, IPs and request
  # paths, the same data the rest of this system keeps inside each group, so
  # sending them to a third party would undo that through the back door.
  # Nothing here leaves the host.
  #
  # Reuses the existing Postgres (its own `glitchtip` database) and Redis
  # (db 1, so it cannot collide with the bot's queues).
  glitchtip: &glitchtip
    # Literal rather than `<<: *logs`: this mapping is itself an anchor that
    # glitchtip-worker merges, and a nested merge key does not reliably survive
    # being merged again.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    image: glitchtip/glitchtip:v4.1.3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment: &glitchtip_env
      DATABASE_URL: postgresql://superbot:superbot@postgres:5432/glitchtip
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY es obligatoria}
      PORT: "8000"
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8100}
      # Nobody should be able to sign themselves up on a LAN-exposed instance.
      ENABLE_OPEN_USER_REGISTRATION: "False"
      # Errors are diagnostics, not archives; 90 days is plenty to spot a
      # pattern and keeps the table from growing without limit.
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "90"
      CELERY_WORKER_AUTOSCALE: "1,3"
    ports:
      - "8100:8000"
    # The default entrypoint starts uwsgi WITHOUT migrating, so a fresh volume
    # or a version bump would serve against a schema that does not match.
    # run-migrate.sh is idempotent, so paying it on every start is free.
    command: sh -c "./bin/run-migrate.sh && ./bin/run-uwsgi.sh"

  # Same image and settings, running the queue that ingests and groups events.
  glitchtip-worker:
    # Both anchors in one merge: two separate `<<` keys is a duplicate key, and
    # the parser keeps only one of them.
    <<: [*glitchtip, *logs]
    ports: []
    command: ./bin/run-celery-with-beat.sh

  redis:
    <<: *logs
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      # 127.0.0.1 only. On 0.0.0.0 with no password (requirepass was empty)
      # this was open read/write to the whole LAN — proven: a host on the
      # network set and read a key. Redis with no auth on a reachable port is
      # also a known RCE vector (CONFIG SET dir + SAVE to plant a file). The
      # app containers reach it as `redis:6379` over the compose network; the
      # published port was never needed.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    <<: *logs
    restart: unless-stopped
    # Liveness. `restart: unless-stopped` only reacts to a process that
    # DIED; a process that is hung but alive keeps counting as running
    # forever. This does not restart anything on its own either — plain
    # compose has no such trigger — but it turns an invisible hang into
    # `unhealthy` in `docker ps`, which is the difference between finding
    # out and not. Deliberately tolerant of any answer under 500: the
    # question is whether the process still replies, not what it replies.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: "@superbot/bot"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Self-hosted GlitchTip. Empty disables reporting entirely, so a missing
      # value is a quiet no-op rather than a failed boot.
      SENTRY_DSN: ${SENTRY_DSN:-}
      PORT: 3002
      BOT_PORT: 3002
      BOT_MODE: polling
      DATABASE_URL: postgresql://superbot:superbot@postgres:5432/superbot?schema=public
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-replace-me}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-replace-me}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-superbot_bot}
      TELEGRAM_APP_URL: ${TELEGRAM_APP_URL:-http://localhost:3003}
      # Set to 1 with a stable named tunnel so the bot trusts TELEGRAM_APP_URL and
      # ignores the rotating /state/app_url file.
      TELEGRAM_APP_URL_PINNED: ${TELEGRAM_APP_URL_PINNED:-}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
      SUPERBOT_OWNER_TELEGRAM_ID: ${SUPERBOT_OWNER_TELEGRAM_ID:-123456789}
      CREADOR_TELEGRAM_ID: ${CREADOR_TELEGRAM_ID:-}
      CREADOR_IA_TELEGRAM_ID: ${CREADOR_IA_TELEGRAM_ID:-}
      # El id de la cuenta del Ayudante: el bot lo usa para reconocer su entrada
      # en un grupo y saber a quien promover. Se compara el ID y no el alias,
      # que se cambia.
      AYUDANTE_TELEGRAM_ID: ${AYUDANTE_TELEGRAM_ID:-}
      SUPERBOT_PLATFORM_ADMIN_TELEGRAM_IDS: ${SUPERBOT_PLATFORM_ADMIN_TELEGRAM_IDS:-}
      # A quien el bot no toca: ni warn, ni ban, ni verificacion, ni
      # presentacion. Va tambien al worker, que es quien corre el barrido de
      # presentaciones; si solo estuviera aqui, ese barrido seguiria avisando.
      SUPERBOT_INTOCABLES_TELEGRAM_IDS: ${SUPERBOT_INTOCABLES_TELEGRAM_IDS:-}
      # Caja fuerte sin tope. Solo la lee el bot.
      ECONOMIA_CAJA_ILIMITADA_IDS: ${ECONOMIA_CAJA_ILIMITADA_IDS:-}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-too}
      MANAGED_BOT_TOKEN_KEY: ${MANAGED_BOT_TOKEN_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-0}
      AI_GROQ_ENABLED: ${AI_GROQ_ENABLED:-0}
      AI_GROQ_API_KEY_1: ${AI_GROQ_API_KEY_1:-}
      AI_GROQ_API_KEY_2: ${AI_GROQ_API_KEY_2:-}
      AI_GROQ_API_KEY_3: ${AI_GROQ_API_KEY_3:-}
      AI_GROQ_API_KEY_4: ${AI_GROQ_API_KEY_4:-}
      AI_GROQ_API_KEY_5: ${AI_GROQ_API_KEY_5:-}
      AI_GROQ_API_KEYS: ${AI_GROQ_API_KEYS:-}
      AI_GROQ_MODEL: ${AI_GROQ_MODEL:-openai/gpt-oss-20b}
      AI_GROQ_KEY_COOLDOWN_SECONDS: ${AI_GROQ_KEY_COOLDOWN_SECONDS:-60}
      AI_GEMINI_ENABLED: ${AI_GEMINI_ENABLED:-0}
      AI_GEMINI_PROJECT_1_API_KEY: ${AI_GEMINI_PROJECT_1_API_KEY:-}
      AI_GEMINI_PROJECT_2_API_KEY: ${AI_GEMINI_PROJECT_2_API_KEY:-}
      AI_GEMINI_PROJECT_3_API_KEY: ${AI_GEMINI_PROJECT_3_API_KEY:-}
      AI_GEMINI_PROJECT_4_API_KEY: ${AI_GEMINI_PROJECT_4_API_KEY:-}
      AI_GEMINI_PROJECT_5_API_KEY: ${AI_GEMINI_PROJECT_5_API_KEY:-}
      AI_GEMINI_API_KEYS: ${AI_GEMINI_API_KEYS:-}
      AI_GEMINI_MODEL: ${AI_GEMINI_MODEL:-gemini-2.5-flash-lite}
      AI_GEMINI_KEY_COOLDOWN_SECONDS: ${AI_GEMINI_KEY_COOLDOWN_SECONDS:-90}
      AI_OPENROUTER_ENABLED: ${AI_OPENROUTER_ENABLED:-0}
      AI_OPENROUTER_API_KEY: ${AI_OPENROUTER_API_KEY:-}
      AI_OPENROUTER_MODEL: ${AI_OPENROUTER_MODEL:-openrouter/free}
      AI_OPENROUTER_ALLOW_PAID_MODELS: ${AI_OPENROUTER_ALLOW_PAID_MODELS:-0}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-groq,gemini,openrouter}
      AI_MAX_REQUESTS_PER_USER_DAY: ${AI_MAX_REQUESTS_PER_USER_DAY:-20}
      AI_MAX_REQUESTS_PER_GROUP_DAY: ${AI_MAX_REQUESTS_PER_GROUP_DAY:-200}
      AI_MAX_TOKENS_PER_REQUEST: ${AI_MAX_TOKENS_PER_REQUEST:-1200}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-8000}
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-3600}
      AI_PRIVACY_MODE: ${AI_PRIVACY_MODE:-normal}
      TELEGRAM_AI_GUEST_MODE_EXPECTED: ${TELEGRAM_AI_GUEST_MODE_EXPECTED:-1}
      TELEGRAM_AI_INLINE_MODE_EXPECTED: ${TELEGRAM_AI_INLINE_MODE_EXPECTED:-1}
      TELEGRAM_AI_STREAM_DRAFTS: ${TELEGRAM_AI_STREAM_DRAFTS:-1}
      TELEGRAM_AI_USE_SEND_CHAT_ACTION: ${TELEGRAM_AI_USE_SEND_CHAT_ACTION:-1}
      GUARDIAN_ENABLED: ${GUARDIAN_ENABLED:-0}
      GUARDIAN_MINIAPP_URL: ${GUARDIAN_MINIAPP_URL:-}
      GUARDIAN_SESSION_SECRET: ${GUARDIAN_SESSION_SECRET:-}
      # The bot dispatches Guardian but never STORES media (api/worker do). Its
      # env is validated by the same rule, so pass the key too — otherwise
      # GUARDIAN_ENABLED in production fails the bot's startup validation.
      GUARDIAN_MEDIA_ENCRYPTION_KEY: ${GUARDIAN_MEDIA_ENCRYPTION_KEY:-}
      # Paired with its rotation fallback (dual-read wiring invariant), even
      # though the bot never reads media — keeps the env consistent with api.
      GUARDIAN_MEDIA_ENCRYPTION_KEY_PREVIOUS: ${GUARDIAN_MEDIA_ENCRYPTION_KEY_PREVIOUS:-}
      GUARDIAN_DEFAULT_STAFF_CHAT_ID: ${GUARDIAN_DEFAULT_STAFF_CHAT_ID:-}
      GUARDIAN_DEFAULT_STAFF_THREAD_ID: ${GUARDIAN_DEFAULT_STAFF_THREAD_ID:-}
      GUARDIAN_TEST_MODE: ${GUARDIAN_TEST_MODE:-0}
      GUARDIAN_TEST_FORCED_GESTURE: ${GUARDIAN_TEST_FORCED_GESTURE:-}
      GUARDIAN_TEST_FORCED_GESTURE_2: ${GUARDIAN_TEST_FORCED_GESTURE_2:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Bind to loopback only, like api (3001), worker (3004) and web (3003).
      # The bot runs in polling mode, so nothing external needs host-level
      # access; other services reach it in-cluster via bot:3002. On 0.0.0.0 the
      # bot's Fastify server (webhook + /health) was reachable from the LAN.
      - "127.0.0.1:3002:3002"
    volumes:
      # Live tunnel URL written by the urlsync sidecar (read-only for the bot).
      - tunnel_state:/state:ro

  api:
    <<: *logs
    restart: unless-stopped
    # Liveness. `restart: unless-stopped` only reacts to a process that
    # DIED; a process that is hung but alive keeps counting as running
    # forever. This does not restart anything on its own either — plain
    # compose has no such trigger — but it turns an invisible hang into
    # `unhealthy` in `docker ps`, which is the difference between finding
    # out and not. Deliberately tolerant of any answer under 500: the
    # question is whether the process still replies, not what it replies.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: "@superbot/api"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Self-hosted GlitchTip. Empty disables reporting entirely, so a missing
      # value is a quiet no-op rather than a failed boot.
      SENTRY_DSN: ${SENTRY_DSN:-}
      API_PORT: 3001
      DATABASE_URL: postgresql://superbot:superbot@postgres:5432/superbot?schema=public
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-replace-me}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-replace-me}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-superbot_bot}
      TELEGRAM_APP_URL: ${TELEGRAM_APP_URL:-http://localhost:3003}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
      SUPERBOT_OWNER_TELEGRAM_ID: ${SUPERBOT_OWNER_TELEGRAM_ID:-123456789}
      # El id de la cuenta del Ayudante: el bot lo usa para reconocer su entrada
      # en un grupo y saber a quien promover. Se compara el ID y no el alias,
      # que se cambia.
      AYUDANTE_TELEGRAM_ID: ${AYUDANTE_TELEGRAM_ID:-}
      SUPERBOT_PLATFORM_ADMIN_TELEGRAM_IDS: ${SUPERBOT_PLATFORM_ADMIN_TELEGRAM_IDS:-}
      # Caja fuerte sin tope. La Mini App tira de aqui.
      ECONOMIA_CAJA_ILIMITADA_IDS: ${ECONOMIA_CAJA_ILIMITADA_IDS:-}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-too}
      MANAGED_BOT_TOKEN_KEY: ${MANAGED_BOT_TOKEN_KEY:-}
      # Temporary target key for a supervised MANAGED_BOT_TOKEN_KEY rotation —
      # consumed by scripts/reencrypt-managed-bot-tokens.mjs from the container
      # env (never argv). Empty outside a rotation; remove after promoting it.
      MANAGED_BOT_TOKEN_KEY_NEW: ${MANAGED_BOT_TOKEN_KEY_NEW:-}
      GUARDIAN_ENABLED: ${GUARDIAN_ENABLED:-0}
      GUARDIAN_VISION_JUDGE_ENABLED: ${GUARDIAN_VISION_JUDGE_ENABLED:-0}
      # Opt-in VPN/proxy lookup (proxycheck.io) on the verifier IP in the STAFF
      # report. Only api builds the report, so only api needs these.
      GUARDIAN_IP_INTEL_ENABLED: ${GUARDIAN_IP_INTEL_ENABLED:-0}
      PROXYCHECK_API_KEY: ${PROXYCHECK_API_KEY:-}
      GUARDIAN_MINIAPP_URL: ${GUARDIAN_MINIAPP_URL:-}
      GUARDIAN_SESSION_SECRET: ${GUARDIAN_SESSION_SECRET:-}
      # Decrypt-only fallback for a GUARDIAN_SESSION_SECRET rotation window. api
      # decrypts join-request query_ids, so without this the dual-read is inert.
      GUARDIAN_SESSION_SECRET_PREVIOUS: ${GUARDIAN_SESSION_SECRET_PREVIOUS:-}
      GUARDIAN_MEDIA_ENCRYPTION_KEY: ${GUARDIAN_MEDIA_ENCRYPTION_KEY:-}
      # Decrypt-only fallback for a GUARDIAN_MEDIA_ENCRYPTION_KEY rotation window.
      GUARDIAN_MEDIA_ENCRYPTION_KEY_PREVIOUS: ${GUARDIAN_MEDIA_ENCRYPTION_KEY_PREVIOUS:-}
      GUARDIAN_DEFAULT_STAFF_CHAT_ID: ${GUARDIAN_DEFAULT_STAFF_CHAT_ID:-}
      GUARDIAN_DEFAULT_STAFF_THREAD_ID: ${GUARDIAN_DEFAULT_STAFF_THREAD_ID:-}
      GUARDIAN_STORAGE_DRIVER: ${GUARDIAN_STORAGE_DRIVER:-local}
      # ABSOLUTE on purpose. Both services start via `pnpm --filter <pkg> start`,
      # so the server process runs with its cwd at /app/apps/<pkg> — NOT /app.
      # A relative "./data/guardian-media" therefore resolved to
      # /app/apps/api/data/guardian-media: inside the container's writable
      # layer, beside the volume rather than in it. Every captured photo was
      # written there and destroyed by the next redeploy, while the database
      # went on recording it as stored; api and worker never shared a byte, so
      # retention only ever marked rows and could not delete a real file.
      GUARDIAN_STORAGE_PATH: ${GUARDIAN_STORAGE_PATH:-/app/data/guardian-media}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-}
      GUARDIAN_RETENTION_HOURS: ${GUARDIAN_RETENTION_HOURS:-72}
      GUARDIAN_MAX_UPLOAD_MB: ${GUARDIAN_MAX_UPLOAD_MB:-25}
      GUARDIAN_TEST_MODE: ${GUARDIAN_TEST_MODE:-0}
      # Guardian photo-mode vision check (Gemini primary, Groq fallback). Safe
      # empty defaults: with no keys the check is "unavailable" and AUTO routes
      # to STAFF rather than approving.
      AI_GEMINI_PROJECT_1_API_KEY: ${AI_GEMINI_PROJECT_1_API_KEY:-}
      AI_GEMINI_PROJECT_2_API_KEY: ${AI_GEMINI_PROJECT_2_API_KEY:-}
      AI_GEMINI_PROJECT_3_API_KEY: ${AI_GEMINI_PROJECT_3_API_KEY:-}
      AI_GEMINI_PROJECT_4_API_KEY: ${AI_GEMINI_PROJECT_4_API_KEY:-}
      AI_GEMINI_PROJECT_5_API_KEY: ${AI_GEMINI_PROJECT_5_API_KEY:-}
      AI_GEMINI_API_KEYS: ${AI_GEMINI_API_KEYS:-}
      AI_GEMINI_MODEL: ${AI_GEMINI_MODEL:-gemini-2.5-flash-lite}
      AI_GROQ_API_KEY_1: ${AI_GROQ_API_KEY_1:-}
      AI_GROQ_API_KEY_2: ${AI_GROQ_API_KEY_2:-}
      AI_GROQ_API_KEY_3: ${AI_GROQ_API_KEY_3:-}
      AI_GROQ_API_KEY_4: ${AI_GROQ_API_KEY_4:-}
      AI_GROQ_API_KEY_5: ${AI_GROQ_API_KEY_5:-}
      AI_GROQ_API_KEYS: ${AI_GROQ_API_KEYS:-}
      GUARDIAN_GROQ_VISION_MODEL: ${GUARDIAN_GROQ_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bound to loopback only: the ONLY legitimate public ingress is the
    # Cloudflare named tunnel (cloudflared-named -> http://web:3003 over the
    # internal compose network), which never uses this host-published port.
    # Publishing this on 0.0.0.0 would let anyone on the LAN (or a router
    # port-forward) hit the api directly and forge Cf-IpCountry, bypassing
    # Cloudflare's header normalization that guardian-verify.controller.ts's
    # country gate relies on. Do not widen this without re-adding a
    # provenance check on cf-ipcountry.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - guardian_media:/app/data/guardian-media

  worker:
    <<: *logs
    restart: unless-stopped
    # Liveness. `restart: unless-stopped` only reacts to a process that
    # DIED; a process that is hung but alive keeps counting as running
    # forever. This does not restart anything on its own either — plain
    # compose has no such trigger — but it turns an invisible hang into
    # `unhealthy` in `docker ps`, which is the difference between finding
    # out and not. Deliberately tolerant of any answer under 500: the
    # question is whether the process still replies, not what it replies.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: "@superbot/worker"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Self-hosted GlitchTip. Empty disables reporting entirely, so a missing
      # value is a quiet no-op rather than a failed boot.
      SENTRY_DSN: ${SENTRY_DSN:-}
      WORKER_PORT: 3004
      WORKER_CONCURRENCY: 2
      DATABASE_URL: postgresql://superbot:superbot@postgres:5432/superbot?schema=public
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-replace-me}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-replace-me}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-superbot_bot}
      TELEGRAM_APP_URL: ${TELEGRAM_APP_URL:-http://localhost:3003}
      # La misma lista que el bot. El barrido de presentaciones corre AQUI, asi
      # que sin esto un intocable seguiria recibiendo la puerta de presentarse.
      SUPERBOT_INTOCABLES_TELEGRAM_IDS: ${SUPERBOT_INTOCABLES_TELEGRAM_IDS:-}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-too}
      MANAGED_BOT_TOKEN_KEY: ${MANAGED_BOT_TOKEN_KEY:-}
      # The worker processes guardian verification-session jobs, so it needs the
      # SAME session secret as api/web to sign/verify them — without it the
      # guardian expiry "queue" fallback can't run. Was missing here.
      GUARDIAN_SESSION_SECRET: ${GUARDIAN_SESSION_SECRET:-}
      # The worker decrypts join-request query_ids in guardian.session.expire, so
      # it needs the same decrypt-only fallback as api during a secret rotation.
      GUARDIAN_SESSION_SECRET_PREVIOUS: ${GUARDIAN_SESSION_SECRET_PREVIOUS:-}
      GUARDIAN_STORAGE_DRIVER: ${GUARDIAN_STORAGE_DRIVER:-local}
      # ABSOLUTE on purpose. Both services start via `pnpm --filter <pkg> start`,
      # so the server process runs with its cwd at /app/apps/<pkg> — NOT /app.
      # A relative "./data/guardian-media" therefore resolved to
      # /app/apps/api/data/guardian-media: inside the container's writable
      # layer, beside the volume rather than in it. Every captured photo was
      # written there and destroyed by the next redeploy, while the database
      # went on recording it as stored; api and worker never shared a byte, so
      # retention only ever marked rows and could not delete a real file.
      GUARDIAN_STORAGE_PATH: ${GUARDIAN_STORAGE_PATH:-/app/data/guardian-media}
      # La clave de cifrado en reposo. El worker es quien baja las fotos de los
      # mensajes (`messages.media_fetch`), asi que necesita la misma clave que
      # bot y api: sin ella las escribiria en claro.
      GUARDIAN_MEDIA_ENCRYPTION_KEY: ${GUARDIAN_MEDIA_ENCRYPTION_KEY:-}
      GUARDIAN_MEDIA_ENCRYPTION_KEY_PREVIOUS: ${GUARDIAN_MEDIA_ENCRYPTION_KEY_PREVIOUS:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      GUARDIAN_RETENTION_HOURS: ${GUARDIAN_RETENTION_HOURS:-72}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Bind to loopback only, like api (3001) and web (3003). The worker exposes
      # POST /v1/jobs/enqueue; on 0.0.0.0 that was reachable from the whole network
      # unauthenticated. Other services still reach it in-cluster via worker:3004.
      - "127.0.0.1:3004:3004"
    volumes:
      - guardian_media:/app/data/guardian-media

  # El Ayudante: una CUENTA DE USUARIO (MTProto) al lado de Modryva, para lo
  # que un bot no puede hacer — censar el grupo de verdad, mencionar a quien no
  # tiene @alias, escribir a quien tiene el bot bloqueado, leer el registro de
  # administracion.
  #
  # Proceso aparte, y por un motivo claro: comparte Postgres
  # y nada mas. Su unica entrada de trabajo es la cola `ayudante_solicitudes`,
  # que va en UN SOLO SENTIDO —el bot encola, este sirve—, asi que un
  # FLOOD_WAIT de tres horas en esta cuenta no para el ciclo de updates.
  #
  # Sin healthcheck HTTP: no levanta servidor. Un proceso colgado aqui deja
  # solicitudes en `pendiente`, que se ve mirando la tabla.
  #
  # NO arranca sin AYUDANTE_SESSION (o AYUDANTE_SESSION_PATH): falla en el
  # arranque con el mensaje de como generarla, en vez de quedarse mudo.
  ayudante:
    <<: *logs
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: "@superbot/ayudante"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://superbot:superbot@postgres:5432/superbot?schema=public
      # De my.telegram.org. Identifican la APP, no la cuenta.
      AYUDANTE_API_ID: ${AYUDANTE_API_ID:-0}
      AYUDANTE_API_HASH: ${AYUDANTE_API_HASH:-}
      # La sesion de la cuenta. Vale lo mismo que su contraseña y no tiene
      # segundo factor: nunca en git, nunca en un log.
      AYUDANTE_SESSION: ${AYUDANTE_SESSION:-}
      AYUDANTE_SESSION_PATH: ${AYUDANTE_SESSION_PATH:-}
      AYUDANTE_POLL_MS: ${AYUDANTE_POLL_MS:-5000}
      AYUDANTE_LOTE: ${AYUDANTE_LOTE:-5}
    depends_on:
      postgres:
        condition: service_healthy

  # Guardian Verification's real server-side visual analyzer (Python/FastAPI/
  # OpenCV/MediaPipe — services/guardian-vision-analyzer). Optional: the api
  # service degrades to manual_review (never a fabricated auto_approve) when
  # this isn't reachable — see modules/guardian/src/decision-engine.ts.
  guardian-vision-analyzer:
    <<: *logs
    restart: unless-stopped
    build:
      context: ./services/guardian-vision-analyzer
      dockerfile: Dockerfile
    ports:
      # 127.0.0.1 only. The api reaches it as `guardian-vision-analyzer:8088`
      # over the compose network; it takes uploaded selfies and returns face/
      # age analysis, so a LAN-open port here is an unauthenticated endpoint
      # you feed images to. Nothing outside the host needs it.
      - "127.0.0.1:8088:8088"
    # Uses the HEALTHCHECK already baked into services/guardian-vision-analyzer/Dockerfile.

  web:
    <<: *logs
    restart: unless-stopped
    # Liveness. `restart: unless-stopped` only reacts to a process that
    # DIED; a process that is hung but alive keeps counting as running
    # forever. This does not restart anything on its own either — plain
    # compose has no such trigger — but it turns an invisible hang into
    # `unhealthy` in `docker ps`, which is the difference between finding
    # out and not. Deliberately tolerant of any answer under 500: the
    # question is whether the process still replies, not what it replies.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: "@superbot/web"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Self-hosted GlitchTip. Empty disables reporting entirely, so a missing
      # value is a quiet no-op rather than a failed boot.
      SENTRY_DSN: ${SENTRY_DSN:-}
      PORT: 3003
      TELEGRAM_APP_URL: ${TELEGRAM_APP_URL:-http://localhost:3003}
      API_INTERNAL_URL: http://api:3001
      DATABASE_URL: postgresql://superbot:superbot@postgres:5432/superbot?schema=public
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-replace-me}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-replace-me}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-superbot_bot}
      BOT_INTERNAL_URL: http://bot:3002
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-too}
      GUARDIAN_ENABLED: ${GUARDIAN_ENABLED:-0}
      GUARDIAN_TEST_MODE: ${GUARDIAN_TEST_MODE:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Same reasoning as api's port above: loopback-only so the Cloudflare
    # tunnel (which reaches this container via the internal compose network,
    # not this host port) remains the only public ingress.
    ports:
      - "127.0.0.1:3003:3003"

  # Public HTTPS for the Telegram Mini App. Only enabled with the "tunnel"
  # profile so normal `docker compose up` never starts it.
  #   dev  : quick tunnel -> https://<random>.trycloudflare.com (URL rotates on restart)
  #   prod : replace command with ["tunnel","run","--token","${TUNNEL_TOKEN}"] (stable named tunnel)
  cloudflared:
    <<: *logs
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:3003"]
    depends_on:
      - web

  # Self-heals the rotating quick-tunnel URL with NO host command: it watches
  # cloudflared's logs (via the Docker socket) and writes the current public URL
  # to a shared volume that the bot reads live. No .env edits, no restarts, no
  # host-drive bind mount. The bot re-sets its Bot-API menu button whenever the
  # URL changes. NOTE: it cannot update BotFather's registered app URL (that needs
  # the bot owner's Telegram account) — so private-chat entry via the menu button
  # self-heals here; group Mini App buttons still need the owner step (or a stable
  # named-tunnel URL) after a rotation.
  urlsync:
    <<: *logs
    profiles: ["tunnel"]
    image: docker:cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tunnel_state:/state
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "urlsync: watching cloudflared for the tunnel URL"
        while true; do
          # Resolve the cloudflared container by compose labels (same project as
          # this container) instead of a hardcoded name, so this works under any
          # compose project name (ultrabot, guardian-test, ...) without editing.
          PROJECT=$$(docker inspect "$$(hostname)" --format '{{ index .Config.Labels "com.docker.compose.project" }}' 2>/dev/null)
          CLOUDFLARED=$$(docker ps --filter "label=com.docker.compose.project=$$PROJECT" --filter "label=com.docker.compose.service=cloudflared" --format '{{.Names}}' | head -1)
          if [ -n "$$CLOUDFLARED" ]; then
            URL=$$(docker logs "$$CLOUDFLARED" 2>&1 | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -1)
            if [ -n "$$URL" ]; then
              CUR=$$(cat /state/app_url 2>/dev/null)
              if [ "$$URL" != "$$CUR" ]; then
                echo "urlsync: $$CUR -> $$URL"
                printf '%s' "$$URL" > /state/app_url
              fi
            fi
          fi
          sleep 10
        done
    depends_on:
      - cloudflared

  # Stable named tunnel (Cloudflare account + a domain on Cloudflare). The public
  # hostname -> http://web:3003 mapping lives in the Cloudflare Zero Trust
  # dashboard, so this service only needs the tunnel token. The URL NEVER rotates,
  # so no urlsync sidecar is needed. Enable with:
  #   docker compose --profile tunnel-named up -d
  # and set CLOUDFLARE_TUNNEL_TOKEN + TELEGRAM_APP_URL + TELEGRAM_APP_URL_PINNED=1
  # in .env.
  cloudflared-named:
    <<: *logs
    profiles: ["tunnel-named"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      - web

volumes:
  postgres_data:
  tunnel_state:
  # Guardian Verification media (local storage driver only — irrelevant when
  # GUARDIAN_STORAGE_DRIVER=s3). Shared between api (writes) and worker (retention
  # cleanup deletes).
  guardian_media:
